<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Couple Party</title>
    <style>
      /* Splash sebelum JS siap: tiruan statis loader Lottie (src/assets/lottie/loader.json). Diganti React begitu app jalan. */
      .cp-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #ffcae9; font: 700 14px/1 system-ui, sans-serif; color: #121212; letter-spacing: 0.08em; text-transform: uppercase; }
      .cp-splash svg { width: 180px; height: auto; overflow: visible; }
      .cp-splash .hop { animation: cp-hop 1.6s cubic-bezier(0.3, 0, 0.3, 1) infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      .cp-splash .hop:nth-child(2) { animation-delay: 0.3s; }
      .cp-splash .hop:nth-child(3) { animation-delay: 0.6s; }
      .cp-splash .tape { background: #ff37a6; border: 3px solid #121212; padding: 6px 10px; transform: skewX(-6deg); box-shadow: 4px 5px 0 #121212; }
      @keyframes cp-hop { 0%, 40%, 100% { transform: translateY(0) scale(1, 1); } 8% { transform: translateY(0) scale(1.15, 0.85); } 20% { transform: translateY(-46px) scale(0.92, 1.08); } 32% { transform: translateY(0) scale(1.18, 0.82); } }
      @media (prefers-reduced-motion: reduce) { .cp-splash .hop { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="cp-splash" role="status" aria-label="Memuat Couple Party">
        <svg viewBox="0 0 240 170" aria-hidden="true">
          <g fill-rule="evenodd" stroke="#121212" stroke-width="3">
            <g>
              <circle class="hop" cx="56" cy="100" r="17" fill="#ff37a6" />
              <polygon class="hop" points="120,79 139,112 101,112" fill="#5cf64a" />
              <rect class="hop" x="162" y="88" width="44" height="24" fill="#87e752" />
            </g>
          </g>
          <g transform="skewX(-8)">
            <rect x="40" y="127" width="206" height="30" fill="#121212" />
            <rect x="35" y="121" width="206" height="30" fill="#fff4fa" stroke="#121212" stroke-width="4" />
            <circle cx="58" cy="132" r="4" fill="#ff37a6" /><circle cx="108" cy="142" r="4" fill="#43b929" /><circle cx="160" cy="130" r="4" fill="#121212" /><circle cx="208" cy="141" r="4" fill="#5cf64a" />
          </g>
        </svg>
        <span class="tape">Couple Party</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
